# Ties the three services together.
#
#   docker compose run --rm collector   # one test collection (writes to docker-test-data/)
#   docker compose run --rm train       # retrain the model on data/
#   docker compose up                   # start the API at http://localhost:8000/docs
#   docker compose down                 # stop and remove everything compose started

services:
  # One-off job: collect one day of prices.
  collector:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    image: flight-collector
    env_file: .env                     # token passed in at run time, never baked in
    volumes:
      - ./docker-test-data:/app/data   # test folder; the GitHub bot owns data/
    profiles: ["jobs"]                 # don't start with "docker compose up"

  # One-off job: train the model and save it to models/.
  train:
    build:
      context: .
      dockerfile: docker/train.Dockerfile
    image: flight-train
    volumes:
      - ./data:/app/data:ro            # read-only: training can't modify the data
      - ./models:/app/models
    profiles: ["jobs"]

  # Long-running service: answers prediction requests.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: flight-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:                       # Docker pings /health to confirm it's alive
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
